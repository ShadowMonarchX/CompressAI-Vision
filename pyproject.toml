[project]
name = "compressai-vision"
version = "0.1.0"
description = "AI-assisted image and video compression API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "pydantic-settings>=2.6,<3",
    "pillow>=10,<12",
    "numpy>=1.26,<3",
    "aiofiles>=24,<25",
]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
