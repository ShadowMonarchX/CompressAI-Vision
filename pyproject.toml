[project]
name = "compressai-vision"
version = "0.1.0"
description = "AI-assisted image and video compression API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "pydantic-settings>=2.6,<3",
    "pillow>=10,<12",
    "numpy>=1.26,<3",
    "aiofiles>=24,<25",
    "orjson>=3.10,<4",
]

[dependency-groups]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2", "pre-commit>=3.8,<4"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "W", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
